<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexExpress – Windows XP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:11px Tahoma,Verdana,sans-serif;user-select:none}
#boot{position:fixed;inset:0;background:#000;color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s}
#boot b{font:italic 700 40px "Trebuchet MS",sans-serif}#boot b i{color:#f60}
.bar{width:160px;height:14px;border:2px solid #aaa;border-radius:4px;overflow:hidden;padding:1px}
.bar span{display:block;height:100%;width:40px;background:repeating-linear-gradient(90deg,#2a5fd8 0 8px,transparent 8px 11px);animation:ld 1.4s linear infinite}
@keyframes ld{from{margin-left:-40px}to{margin-left:160px}}
#desk{position:fixed;inset:0 0 30px 0;background:radial-gradient(ellipse at 30% 110%,#4c9a2a 0 35%,transparent 36%),radial-gradient(ellipse at 90% 120%,#3a8a1e 0 40%,transparent 41%),linear-gradient(#2b6fd6,#7db4f0 70%)}
.ico{position:absolute;width:76px;text-align:center;color:#fff;text-shadow:1px 1px 2px #000;cursor:default;padding:4px}
.ico:hover,.ico.sel{background:rgba(49,106,197,.5)}
.ico .g{width:40px;height:40px;margin:0 auto 3px;border-radius:6px;display:grid;place-items:center;font-size:26px}
.nx{background:#232f3e;position:relative}
.nx svg{width:34px}
#tb{position:fixed;left:0;right:0;bottom:0;height:30px;background:linear-gradient(#245edb,#3f8cf3 10%,#245edb 90%,#1941a5);display:flex;align-items:center;z-index:50}
#start{height:100%;width:100px;border:0;border-radius:0 12px 12px 0;background:linear-gradient(#5aa842,#3c8f2a 50%,#2f7a1f);color:#fff;font:italic 700 17px "Trebuchet MS",sans-serif;text-shadow:1px 1px 2px #000;cursor:pointer}
#start:active{filter:brightness(.85)}
#tasks{flex:1;display:flex;gap:3px;padding:0 6px}
.task{width:150px;height:22px;border-radius:3px;background:#3c81f3;border:1px solid #1b49b3;color:#fff;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.task.on{background:#1e52b7;box-shadow:inset 1px 1px 3px #0c2a73}
#clock{height:100%;padding:0 14px;background:linear-gradient(#0f9bec,#1290e0);border-left:1px solid #0b5ba8;color:#fff;display:flex;align-items:center}
#menu{position:fixed;left:0;bottom:30px;width:300px;background:#fff;border:2px solid #245edb;border-radius:8px 8px 0 0;z-index:60;display:none;overflow:hidden}
#menu .h{background:linear-gradient(#245edb,#3f8cf3);color:#fff;padding:10px;font:700 14px Tahoma}
#menu div.it{padding:9px 12px;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
#menu div.it:hover{background:#316ac5;color:#fff}
.win{position:absolute;background:#ece9d8;border:3px solid #0831d9;border-top:0;border-radius:8px 8px 0 0;box-shadow:3px 3px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;min-width:320px;min-height:200px}
.win .t{height:28px;background:linear-gradient(#0a5de8,#3d95ff 8%,#0a5de8 40%,#0050d8 88%,#0042b8);border-radius:6px 6px 0 0;color:#fff;font:700 13px Tahoma;display:flex;align-items:center;padding:0 4px 0 8px;text-shadow:1px 1px #000;cursor:move;margin:0 -3px;gap:6px}
.t span.n{flex:1;white-space:nowrap;overflow:hidden}
.t button{width:22px;height:22px;border:1px solid #fff;border-radius:4px;background:linear-gradient(#5b92f6,#2a5fd8);color:#fff;font-weight:700;cursor:pointer;line-height:1;padding:0}
.t button.x{background:linear-gradient(#e8845f,#c8381a)}
.win.max{inset:0 0 30px 0!important;width:auto!important;height:auto!important;border-radius:0}
.body{flex:1;overflow:auto;background:#fff;margin:0 0 0;min-height:0}
/* NexExpress */
#shop{font:13px "Segoe UI",Tahoma,sans-serif;color:#0f1111;background:#eaeded;user-select:none}
.nh{background:#232f3e;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 12px;position:sticky;top:0;z-index:5}
.logo{font:700 24px "Trebuchet MS",sans-serif;letter-spacing:-1px;position:relative;padding-bottom:9px}
.logo i{color:#ff9900;font-style:normal}
.logo svg{position:absolute;left:4px;bottom:0;width:92px;height:11px}
.nh input{flex:1;min-width:80px;padding:8px;border:0;border-radius:4px 0 0 4px;font-size:14px}
.nh .srch{background:#ff9900;border:0;padding:8px 12px;margin-left:-12px;border-radius:0 4px 4px 0;font-weight:700;cursor:pointer}
.wal{background:#131a22;padding:6px 10px;border-radius:4px;white-space:nowrap}
.cats{display:flex;gap:6px;flex-wrap:wrap;background:#37475a;padding:6px 12px}
.cats button{background:none;border:1px solid transparent;color:#fff;padding:4px 10px;border-radius:14px;cursor:pointer}
.cats button.on,.cats button:hover{border-color:#ff9900;color:#ff9900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.card{background:#fff;border-radius:4px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card canvas{width:72px;height:72px;margin:0 auto;image-rendering:pixelated}
.card h4{margin:0;font-size:13px;min-height:32px}
.pr{font-weight:700;color:#b12704}
.card .b{display:flex;gap:4px}
.card button,.dlg button{flex:1;border:1px solid #a88734;border-radius:14px;padding:5px;cursor:pointer;font-size:12px;background:#ffd814}
.card button.neg{background:#ffa41c;border-color:#ff8f00}
.card button:disabled{background:#ddd;border-color:#bbb;cursor:default}
.inv{padding:12px;background:#fff;margin:0 12px 12px;border-radius:4px;display:none}
.inv.show{display:block}
.inv span{display:inline-block;margin:3px;padding:3px 7px;background:#f0f2f2;border-radius:10px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:9}
.dlg{background:#fff;width:min(380px,94%);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat{height:150px;overflow:auto;background:#f3f3f3;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px}
.chat p{margin:0;padding:5px 9px;border-radius:10px;max-width:85%}
.chat .s{background:#fff;border:1px solid #ccc}
.chat .u{background:#ffd814;align-self:flex-end}
.dlg .row{display:flex;gap:6px}
.dlg input{flex:1;padding:6px;border:1px solid #888;border-radius:4px}
.toast{position:fixed;bottom:40px;right:12px;background:#232f3e;color:#fff;padding:10px 14px;border-radius:6px;z-index:80;display:none}

/* ===== XP Luna Feinschliff ===== */
#desk{background:
radial-gradient(ellipse 42% 13% at 22% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 72%),
radial-gradient(ellipse 28% 8% at 30% 23%,rgba(255,255,255,.8),transparent 70%),
radial-gradient(ellipse 36% 11% at 82% 19%,rgba(255,255,255,.9),transparent 70%),
radial-gradient(ellipse 28% 8% at 62% 38%,rgba(255,255,255,.6),transparent 70%),
radial-gradient(ellipse 140% 70% at 20% 132%,#7bd035 0,#4aa724 45%,#2b7a10 99%,transparent 100%),
radial-gradient(ellipse 100% 56% at 100% 130%,#5cb82c 0,#2f8412 99%,transparent 100%),
linear-gradient(#1c5fd0 0,#4a8fe6 35%,#9cc9f5 62%,#d4e8fb 72%)}
#tb{background:linear-gradient(#3168d5 0,#4993e6 3%,#2a6ee0 8%,#245edb 50%,#2354d0 85%,#1941a5 100%);border-top:1px solid #0c3fbf}
#start{width:106px;margin-right:8px;border-radius:0 14px 14px 0;background:linear-gradient(#5db35a 0,#3f9a3c 12%,#379032 50%,#2b7d27 90%,#206b1d);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),2px 0 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:5px;font:italic 700 19px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px 2px #1a4a14}
#start svg{width:19px;height:19px}
.task{height:24px;background:linear-gradient(#4f8ef3,#2e6fe0);border:1px solid #1a4cb5;box-shadow:inset 0 1px 0 #7fb0ff;font-size:11px}
.task.on{background:linear-gradient(#1a45a8,#1f55c0);box-shadow:inset 1px 1px 3px rgba(0,0,0,.55)}
#clock{gap:8px;background:linear-gradient(#0f8ff0,#1a9af3 10%,#1290e8 90%,#0b6fc0);border-left:1px solid #0a4aa0;box-shadow:inset 1px 0 0 #3ab5f7}
.win{background:#0831d9;border-color:#0831d9;border-radius:9px 9px 0 0}
.win .t{height:30px;background:linear-gradient(#0997ff 0,#0053ee 8%,#0050ee 40%,#0066ff 88%,#005bff 93%,#003dd7 100%);border-radius:8px 8px 0 0;font:700 13px "Trebuchet MS",Tahoma,sans-serif}
.win.off{background:#7a96df;border-color:#7a96df}
.win.off .t{background:linear-gradient(#7aa0f0,#7a9be8 8%,#7596e6 40%,#86a4ee 88%,#6b8be0);color:#d8e4f8}
.t button{width:21px;height:21px;border:1px solid #fff;border-radius:3px;background:radial-gradient(circle at 30% 25%,#7aa8ff,#2a5fe0 70%);font:700 12px Tahoma}
.t button.x{background:radial-gradient(circle at 30% 25%,#eeaa95,#d0401f 70%)}
.body{display:flex;flex-direction:column}
#menu{width:380px;border:0;border-radius:8px 8px 0 0;box-shadow:2px -2px 8px rgba(0,0,0,.5)}
#menu .h{display:flex;align-items:center;gap:10px;font-size:16px;padding:8px 10px;background:linear-gradient(#1e5fd8,#4a8ff0 15%,#1c58d0);border-bottom:2px solid #f89e3a;text-shadow:1px 1px #0a2a80}
#menu .av{width:42px;height:42px;border-radius:5px;border:2px solid #fff;background:linear-gradient(#7cc15c,#3c8f2a);display:grid;place-items:center;font-size:24px}
#menu .cols{display:flex}#menu .cl{flex:1;padding:4px 0}
#menu .cr{width:160px;background:#d3e5fa;padding:4px 0;border-left:1px solid #95bdee}
#menu .ft{background:linear-gradient(#245edb,#3f8cf3);padding:4px 8px;display:flex;justify-content:flex-end}
#menu .ft .it{color:#fff;padding:5px 10px}
.ie{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#ece9d8}
#shop{flex:1;overflow:auto;min-height:0;position:relative}
.mb{padding:2px 8px;display:flex;gap:14px;border-bottom:1px solid #aca899}
.tbr{display:flex;gap:4px;padding:3px;border-bottom:1px solid #aca899}
.tbr button{background:none;border:1px solid transparent;font:11px Tahoma;padding:2px 7px;border-radius:3px;cursor:pointer}
.tbr button:hover{border-color:#999;background:#f7f6ee}
.adr{display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #aca899}
.adr .url{flex:1;background:#fff;border:1px solid #7f9db9;padding:2px 5px}
.adr button{font:11px Tahoma}
.sb{border-top:1px solid #aca899;display:flex;gap:10px;padding:2px 8px}.sb span:first-child{flex:1}
.vb{font-size:11px;font-weight:400;color:#565959;border:1px solid #888;border-radius:3px;padding:0 4px;margin-left:3px}

/* ===== Winamp + Owner ===== */
.win.wa{background:#2b2b3a;border-color:#2b2b3a;border-radius:3px;min-width:275px;min-height:100px}
.win.wa .t{height:18px;background:linear-gradient(#6a6a82,#34344a 50%,#26263a);font:700 10px Arial;border-radius:2px 2px 0 0;text-shadow:none;letter-spacing:1px}
.win.wa.off .t{background:linear-gradient(#4a4a5a,#2a2a38);color:#aaa}
.win.wa .t button{width:14px;height:14px;font-size:9px;border-radius:2px;border-color:#888;background:#44445a}
.wab{background:#1c1c28;padding:6px;color:#0f0;font:11px Arial;flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.lcd{background:#000;border:2px inset #555;padding:4px 6px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center}
.lcd .tm{font:700 30px "Courier New",monospace;color:#0f0;grid-row:span 2;text-shadow:0 0 4px #0f0}
.lcd canvas{width:100%;height:16px;image-rendering:pixelated}
.mq{grid-column:1/3;overflow:hidden;white-space:nowrap;color:#0f0}
.mq span{display:inline-block;animation:mq 9s linear infinite}
@keyframes mq{from{transform:translateX(60%)}to{transform:translateX(-100%)}}
.lcd .inf{grid-column:1/3;font-size:9px;color:#0a0}
.wab input[type=range]{accent-color:#0c0;margin:0}
.sl{width:100%}.vol{width:70px;margin-left:auto!important}
.ctl{display:flex;gap:3px;align-items:center}
.ctl button{width:34px;height:22px;background:linear-gradient(#8a8aa0,#44445a);border:1px solid #111;border-radius:2px;color:#eee;cursor:pointer;font-size:12px;padding:0}
.ctl button:active{background:#33334a}
.pl{background:#000;flex:1;overflow:auto;border:2px inset #555;min-height:70px}
.pl div{padding:1px 4px;cursor:default;white-space:nowrap}.pl .cur{color:#fff}.pl div:hover{background:#0000c6}
.orow{display:flex;gap:6px}.orow input,.orow select{flex:1;min-width:0}
.rvl{font-size:12px;color:#007185;cursor:pointer;text-decoration:none}.rvl:hover{text-decoration:underline;color:#c45500}
.rev{border-bottom:1px solid #ddd;padding:5px 0;font-size:12px;display:flex;flex-direction:column;gap:3px}
.rep{background:#fff8e1;border-left:3px solid #ff9900;padding:4px 6px}.ver{color:#c45500;font-size:11px}
.dlg .rvs{max-height:200px;overflow:auto}.dlg select{padding:5px;flex:1}
.ord{display:flex;gap:6px;align-items:center;padding:2px 0;border-bottom:1px solid #eee}
.ord.done span{text-decoration:line-through;color:#888}
.ck{width:20px;height:20px;border:1px solid #666;background:#fff;cursor:pointer;border-radius:3px;padding:0;color:#0a0;font-weight:700;flex:none}
.ord.done .ck{background:#cfc}
</style>
</head>
<body>
<div id="boot"><b>Nex<i>XP</i></b><div class="bar"><span></span></div><small>Windows wird gestartet…</small></div>

<div id="desk">
  <div class="ico" style="left:10px;top:10px" data-open="shop"><div class="g nx"><svg viewBox="0 0 40 30"><text x="20" y="18" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Trebuchet MS">nx</text><path d="M6 23q14 8 28 0" stroke="#f90" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>NexExpress</div>
  <div class="ico" style="left:10px;top:100px" data-open="pc"><div class="g" style="background:#6ea8ff">🖥️</div>Arbeitsplatz</div>
  <div class="ico" style="left:10px;top:190px" data-open="bin"><div class="g" style="background:#9cc">🗑️</div>Papierkorb</div>
  <div class="ico" style="left:100px;top:10px" data-open="wa"><div class="g" style="background:#111;color:#f90">⚡</div>Winamp</div>
  <div class="ico" id="ownico" style="left:100px;top:100px;display:none" data-open="owner"><div class="g" style="background:#f5c518">👑</div>Owner-Panel</div>
</div>

<div id="menu"><div class="h"><div class="av">⛏️</div><span id="uname">Steve</span></div>
<div class="cols"><div class="cl"><div class="it" data-open="shop">🛒 NexExpress</div><div class="it" data-open="wa">⚡ Winamp</div><div class="it" data-open="pc">🖥️ Arbeitsplatz</div><div class="it" data-open="login" id="logit">🔑 Anmelden</div></div>
<div class="cr"><div class="it" data-open="pc">📁 Eigene Dateien</div><div class="it" data-open="bin">🗑️ Papierkorb</div></div></div>
<div class="ft"><div class="it" id="off">⏻ Ausschalten</div></div></div>

<div id="tb"><button id="start"><svg viewBox="0 0 20 20"><path d="M1 3.5q4-2 8 0v6q-4-2-8 0z" fill="#f25022"/><path d="M11 3.5q4 2 8 0v6q-4 2-8 0z" fill="#7fba00"/><path d="M1 11.5q4-2 8 0v6q-4-2-8 0z" fill="#00a4ef"/><path d="M11 11.5q4 2 8 0v6q-4 2-8 0z" fill="#ffb900"/></svg>start</button><div id="tasks"></div><div id="clock"><span>🔊</span><span id="ct"></span></div></div>
<div class="toast" id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
setTimeout(()=>{$('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),600)},1800);
setInterval(()=>$('#ct').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),1000);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display='none',2500)}

/* ---------- Fenster ---------- */
let z=10,wins={};
function openWin(id,title,html,w=420,h=300,init){
  if(wins[id]){show(id);return wins[id].el}
  const el=document.createElement('div');el.className='win';
  el.style.cssText=`left:${40+Object.keys(wins).length*28}px;top:${30+Object.keys(wins).length*28}px;width:${w}px;height:${h}px;z-index:${++z}`;
  el.innerHTML=`<div class="t"><span class="n">${title}</span><button class="mi">_</button><button class="ma">□</button><button class="x">✕</button></div><div class="body" style="position:relative">${html}</div>`;
  $('#desk').appendChild(el);
  const task=document.createElement('div');task.className='task';task.textContent=title;$('#tasks').appendChild(task);
  wins[id]={el,task};
  const front=()=>{el.style.zIndex=++z;Object.values(wins).forEach(o=>{o.task.classList.remove('on');o.el.classList.add('off')});task.classList.add('on');el.classList.remove('off')};
  el.addEventListener('mousedown',front);front();
  task.onclick=()=>{el.style.display==='none'||!task.classList.contains('on')?(el.style.display='flex',front()):(el.style.display='none',task.classList.remove('on'))};
  $('.mi',el).onclick=()=>{el.style.display='none';task.classList.remove('on')};
  $('.ma',el).onclick=()=>el.classList.toggle('max');
  $('.x',el).onclick=()=>{el.remove();task.remove();delete wins[id]};
  const t=$('.t',el);
  t.ondblclick=e=>{if(e.target===t||e.target.className==='n')el.classList.toggle('max')};
  t.onmousedown=e=>{if(e.target.tagName==='BUTTON'||el.classList.contains('max'))return;
    const dx=e.clientX-el.offsetLeft,dy=e.clientY-el.offsetTop;
    const mv=ev=>{el.style.left=ev.clientX-dx+'px';el.style.top=Math.max(0,ev.clientY-dy)+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up)};
  if(init)init(el);
  return el;
}
function show(id){const w=wins[id];w.el.style.display='flex';w.el.dispatchEvent(new Event('mousedown'))}
const apps={
  pc:()=>openWin('pc','Arbeitsplatz','<p style="padding:14px">Lokaler Datenträger (C:)<br>Minecraft-Welt (D:)<br><br>Tipp: Öffne NexExpress!</p>',340,220),
  bin:()=>openWin('bin','Papierkorb','<p style="padding:14px">Der Papierkorb ist leer.</p>',300,180),
  shop:()=>openShop(),
  wa:()=>openWinamp(),
  login:()=>owner?setOwner(false):openLogin(),
  owner:()=>owner&&openOwner()
};
document.querySelectorAll('[data-open]').forEach(e=>{
  const go=()=>{apps[e.dataset.open]();$('#menu').style.display='none'};
  e.classList.contains('ico')?e.ondblclick=go:e.onclick=go;
  if(e.classList.contains('ico'))e.onclick=()=>{document.querySelectorAll('.ico').forEach(i=>i.classList.remove('sel'));e.classList.add('sel')};
});
$('#start').onclick=e=>{e.stopPropagation();const m=$('#menu');m.style.display=m.style.display==='block'?'none':'block'};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').style.display='none'});
$('#off').onclick=()=>{document.body.innerHTML='<div style="background:#000;color:#fff;height:100%;display:grid;place-items:center;font:20px Tahoma">Du kannst den Computer jetzt ausschalten. (Seite neu laden zum Starten)</div>'};

/* ---------- Blockdaten: [Name, Farbe, Kategorie, Preis in Smaragden] ---------- */
const B=[];

function texture(b){
  const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
  let s=0;for(const ch of b.n)s=(s*31+ch.charCodeAt(0))>>>0;
  const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const [R,G,Bl]=[1,3,5].map(i=>parseInt(b.col.length==4?b.col[(i+1)/2|0].repeat(2):b.col.substr(i,2),16));
  for(let i=0;i<16;i++)for(let j=0;j<16;j++){const k=.82+r()*.36;x.fillStyle=`rgb(${R*k|0},${G*k|0},${Bl*k|0})`;x.fillRect(i,j,1,1)}
  x.strokeStyle='rgba(0,0,0,.35)';x.strokeRect(.5,.5,15,15);
  return c;
}

function loadTex(b,cv){
  const id=b.t||(TEX[b.n]&&'block/'+TEX[b.n]);if(!id)return;
  const im=new Image();
  im.onload=()=>{const w=im.naturalWidth;if(!w)return;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,16,16);x.drawImage(im,0,0,w,w,0,0,16,16)};

      const cv=texture(b);cv.style.cssText='width:56px;height:56px;image-rendering:pixelated';loadTex(b,cv);$('#oc',dl).appendChild(cv);
      const qn=$('#qn',dl),qi=$('#qi',dl),get=()=>Math.min(1000,Math.max(1,parseInt(qn.value)||1));
      const upd=()=>{const n=get(),t=n*unit;qi.innerHTML=`${s>1?`<b>${n} Stack${n>1?'s':''}</b> = ${n*s} Stück`:`<b>${n}×</b>`} · Gesamt: <b>💎 ${t}</b>${t>emeralds?' <span style="color:#c00">– zu wenig Smaragde</span>':''}`};
      qn.oninput=upd;$('#qm',dl).onclick=()=>{qn.value=Math.max(1,get()-1);upd()};$('#qp',dl).onclick=()=>{qn.value=Math.min(1000,get()+1);upd()};upd();
      $('#ocl',dl).onclick=()=>ov.style.display='none';
      $('#ook',dl).onclick=()=>{
        const name=$('#bn',dl).value.trim();
        if(name.length<2){toast('Bitte einen Namen eingeben (mind. 2 Zeichen)');return}
        if(purchase(b,unit,get(),$('#bd',dl).value.trim(),name))ov.style.display='none';
      };
    }
    function openReviews(b){
      const ov=$('.ov',el),dl=$('.dlg',el);
      dl.style.maxHeight='92%';dl.style.overflow='auto';ov.style.display='grid';dl.textContent='Lade Bewertungen…';
      const draw=async()=>{
        let all=[];try{all=await store.list('reviews');revs=all;updRv()}catch(e){}
        const list=all.filter(r=>r.item===b.n).sort((x,y)=>y.time-x.time);
        dl.innerHTML=`<b>Bewertungen: ${esc(b.n)}</b><div class="rvs">${list.length?list.map(r=>`<div class="rev"><div>${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)} <b>${esc(r.name)}</b>${r.ver?' <span class="ver">✔ Verifizierter Kauf</span>':''} <small>${new Date(r.time).toLocaleDateString('de-DE')}</small></div><div>${esc(r.text)}</div>${r.reply?`<div class="rep"><b>Antwort von Nexor (CHEFFE):</b> ${esc(r.reply)}</div>`:owner?`<div class="row"><input class="ri" placeholder="Antwort schreiben…"><button class="rb" data-id="${esc(r.id)}">Antworten</button></div>`:''}</div>`).join(''):'<p>Noch keine Bewertungen. Schreib die erste!</p>'}</div>
        <b>Deine Bewertung</b>
        <div class="row"><input id="rn" maxlength="30" placeholder="Dein Name" value="${esc(buyerName)}"></div>
        <div class="row"><select id="rs"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div>
        <div class="row"><input id="rt" maxlength="300" placeholder="Was meinst du zu diesem Block?"></div>
        <div class="row"><button id="rsend">Absenden</button><button id="rclose" style="background:#e7e9ec;border-color:#aaa">Schließen</button></div>`;
        $('#rclose',dl).onclick=()=>{ov.style.display='none';dl.style.maxHeight='';dl.style.overflow=''};
        $('#rsend',dl).onclick=async()=>{
          const n=$('#rn',dl).value.trim(),t=$('#rt',dl).value.trim();
          if(n.length<2||t.length<2){toast('Bitte Name und Text ausfüllen');return}
          if(!buyerName)buyerName=n;
          try{await store.add('reviews',{item:b.n,name:n,stars:+$('#rs',dl).value,text:t,time:Date.now(),ver:!!owned[b.n]})}catch(e){toast('Speichern fehlgeschlagen');return}
          toast('Danke für deine Bewertung!');draw();
        };
        dl.querySelectorAll('.rb').forEach(btn=>btn.onclick=async()=>{
          const v=btn.previousElementSibling.value.trim();if(!v)return;
          try{await store.patch('reviews',btn.dataset.id,{reply:v,replyTime:Date.now()})}catch(e){toast('Antwort fehlgeschlagen');return}
          draw();
        });
      };
      draw();
    }
    function negotiate(b){
      const ov=$('.ov',el),dl=$('.dlg',el);
      const min=Math.max(1,Math.round(b.p*(.55+Math.random()*.2)));
      let ask=b.p;
      dl.innerHTML=`<b>Verhandlung: ${b.n}</b><div class="chat"></div>
        <div class="row"><input type="number" min="1" id="off" placeholder="Dein Angebot in Smaragden"><button id="go">Anbieten</button></div>
        <div class="row"><button id="cl" style="background:#e7e9ec;border-color:#aaa">Abbrechen</button></div>`;
      ov.style.display='grid';
      const ch=$('.chat',dl),say=(t,c)=>{const p=document.createElement('p');p.className=c;p.textContent=t;ch.appendChild(p);ch.scrollTop=1e9};
      say(`${(b.s||64)>1?'Ein Stack':'Ein Stück'} ${b.n} kostet ${b.p} Smaragde VB. Was bietest du (pro ${(b.s||64)>1?'Stack':'Stück'})?`,'s');
      let rounds=0;
      $('#cl',dl).onclick=()=>ov.style.display='none';
      $('#go',dl).onclick=()=>{
        const o=parseInt($('#off',dl).value);if(!o||o<1)return;
        say(`Ich biete ${o}.`,'u');rounds++;
        if(o>=min){
          say(`Abgemacht! ${o} Smaragde.`,'s');
          setTimeout(()=>orderDialog(b,Math.min(o,ask)),700);return;
        }
        if(rounds>=4){say('Das wird nichts. Ich verkaufe an jemand anderen.','s');$('#go',dl).disabled=true;return}
        ask=Math.max(min+1,Math.round(ask-(ask-o)*.4));
        say(o<min*.6?`Das ist ein Witz. Ich kann auf ${ask} runtergehen.`:`Knapp. Wie wäre es mit ${ask}?`,'s');
        $('#off',dl).value='';
        const acc=document.createElement('p');acc.className='s';acc.innerHTML=`<a href="#" style="color:#007185">${ask} akzeptieren</a>`;
        ch.appendChild(acc);acc.firstChild.onclick=e=>{e.preventDefault();orderDialog(b,ask)};ch.scrollTop=1e9;
      };
    }
    window.shopRender=render;render();loadRev();
  });
}

/* ---------- Speicher für Bestellungen & Bewertungen ---------- */
// Leer lassen = alles nur im eigenen Browser. Mit Firebase-Adresse = für alle sichtbar.
const DB_URL='https://nexespress-default-rtdb.europe-west1.firebasedatabase.app';
let buyerName='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsRead=p=>{try{return JSON.parse(localStorage.getItem('nx_'+p)||'{}')}catch(e){return{}}};
const store={
  async list(p){
    let d;
    if(DB_URL){d=(await (await fetch(`${DB_URL}/${p}.json`)).json())||{};if(d.error)throw 0}else d=lsRead(p);
    return Object.entries(d).map(([id,v])=>({id,...v}));
  },
  async add(p,o){
    if(DB_URL){const r=await fetch(`${DB_URL}/${p}.json`,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;return}
    const d=lsRead(p);d[Date.now().toString(36)+Math.random().toString(36).slice(2,6)]=o;localStorage.setItem('nx_'+p,JSON.stringify(d));
  },
  async patch(p,id,o){
    if(DB_URL){const r=await fetch(`${DB_URL}/${p}/${id}.json`,{method:'PATCH',body:JSON.stringify(o)});if(!r.ok)throw 0;return}
    const d=lsRead(p);if(d[id]){Object.assign(d[id],o);localStorage.setItem('nx_'+p,JSON.stringify(d))}
  }
};

/* ---------- Live-Bestellungen ---------- */
let orders=[],seen=null,pollId=null;
const beep=()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.1;o.start();o.stop(a.currentTime+.15)}catch(e){}};
function renderOrders(){
  const open=orders.filter(o=>!o.done).length,ic=document.querySelector('#ownico');
  if(ic)ic.lastChild.textContent=open?`Owner-Panel (${open})`:'Owner-Panel';
  const box=document.querySelector('#ol');if(!box)return;
  const l=[...orders].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||b.time-a.time);
  box.innerHTML=l.length?l.map(o=>`<div class="ord${o.done?' done':''}"><button class="ck" data-id="${esc(o.id)}" title="${o.done?'Wieder öffnen':'Als fertig markieren'}">${o.done?'✔':''}</button><span>${new Date(o.time).toLocaleTimeString('de-DE')} – <b>${esc(o.name)}</b> kauft ${esc(o.stacks?(o.size>1?o.stacks+' Stack'+(o.stacks>1?'s':'')+' ('+o.stacks*o.size+' Stück) ':o.stacks+'× '):'')}${esc(o.item)} (${esc(o.price)} 💎)${o.note?'<br>📝 '+esc(o.note):''}</span></div>`).join(''):'Noch keine Bestellungen.';
  box.querySelectorAll('.ck').forEach(b=>b.onclick=async()=>{
    const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;
    const v=!o.done;o.done=v;renderOrders();
    try{await store.patch('orders',o.id,{done:v,doneTime:Date.now()})}catch(e){o.done=!v;renderOrders();toast('Konnte nicht gespeichert werden')}
  });
}
async function pollOrders(){
  if(!owner)return;
  try{
    orders=await store.list('orders');
    if(seen){const fresh=orders.filter(o=>!seen.has(o.id));if(fresh.length){toast(`🛒 Neue Bestellung von ${fresh[0].name}: ${fresh[0].item}`);beep()}}
    seen=new Set(orders.map(o=>o.id));renderOrders();
  }catch(e){}
}

/* ---------- Owner-Login ---------- */
const HASH='e82429c03b2e3552d4a3da22ed76b806950b0d1f9757520b263afa5a0f9f4847';
let owner=false;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function setOwner(v){
  owner=v;$('#uname').textContent=v?'Nexor (CHEFFE)':'Steve';
  $('#ownico').style.display=v?'block':'none';$('#logit').textContent=v?'🚪 Abmelden':'🔑 Anmelden';
  if(!v&&wins.owner)wins.owner.el.querySelector('.x').click();
  toast(v?'Willkommen, Cheffe!':'Abgemeldet');
  clearInterval(pollId);seen=null;
  if(v){pollOrders();pollId=setInterval(pollOrders,3000)}else orders=[];
}
function openLogin(){
  openWin('login','Bei NexExpress anmelden',`<div style="flex:1;padding:14px;background:#ece9d8;display:flex;flex-direction:column;gap:8px;font-size:12px">
  <b>Owner-Login</b><label>Benutzername<br><input id="lu" style="width:100%"></label><label>Passwort<br><input id="lp" type="password" style="width:100%"></label>
  <div id="le" style="color:#c00;min-height:14px"></div><button id="lg" style="padding:4px">OK</button></div>`,300,260,el=>{
    const go=async()=>{
      const u=$('#lu',el).value.trim().toLowerCase(),p=$('#lp',el).value,e=$('#le',el);
      let h;try{h=await sha(u+'|'+p)}catch(x){e.textContent='Anmeldung braucht https (GitHub Pages).';return}
      if(h===HASH){wins.login.el.querySelector('.x').click();setOwner(true)}else e.textContent='Benutzername oder Kennwort falsch.';
    };
    $('#lg',el).onclick=go;el.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
    setTimeout(()=>$('#lu',el).focus(),50);
  });
}
const LS='nexexpress_owner_data';
function saveData(){try{localStorage.setItem(LS,JSON.stringify({p:Object.fromEntries(B.map(b=>[b.n,b.p])),x:B.filter(b=>b.extra)}))}catch(e){}}
(function(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d)return;B.forEach(b=>{if(d.p[b.n]!=null)b.p=d.p[b.n]});d.x.forEach(x=>{if(!B.some(b=>b.n===x.n))B.push(x)})}catch(e){}})();
function openOwner(){
  const opts=()=>B.map(b=>`<option>${b.n}</option>`).join('');
  openWin('owner','Owner-Panel – Nexor (CHEFFE)',`<div style="flex:1;overflow:auto;padding:12px;background:#ece9d8;font-size:12px;display:flex;flex-direction:column;gap:8px">
  <b>👑 Smaragde</b><div class="orow"><input id="oe" type="number" value="${emeralds}"><button id="oes">Setzen</button></div>
  <b>Preis pro Stack (VB) ändern</b><div class="orow"><select id="os">${opts()}</select><input id="op" type="number" min="1" placeholder="Neuer Preis"><button id="ops">Speichern</button></div>
  <b>Neuer Block / Item</b><div class="orow"><input id="nn" placeholder="Name"><input id="nc" type="color" value="#888888" style="flex:0 0 40px"></div>
  <div class="orow"><select id="nk">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><input id="np" type="number" min="1" placeholder="Preis/Stack"><select id="ns" style="flex:0 0 70px"><option value="64">×64</option><option value="16">×16</option><option value="1">×1</option></select><button id="nb">Hinzufügen</button></div>
  <b>🧾 Bestellungen <small>(live, alle 3 Sek.)</small></b><div id="ol" style="background:#fff;border:1px solid #888;padding:4px;max-height:200px;overflow:auto;min-height:40px">Lade…</div>
  <div class="orow"><button id="olr">Aktualisieren</button></div>
  <small>Preise/neue Blöcke: nur in deinem Browser. ${DB_URL?'Bestellungen &amp; Bewertungen liegen online.':'Ohne Online-Datenbank sind Bestellungen &amp; Bewertungen nur in diesem Browser sichtbar.'}</small></div>`,400,540,el=>{
    const refresh=()=>{try{if(wins.shop)window.shopRender()}catch(e){}};
    $('#olr',el).onclick=pollOrders;renderOrders();
    $('#oes',el).onclick=()=>{emeralds=Math.max(0,parseInt($('#oe',el).value)||0);const m=document.querySelector('#em');if(m)m.textContent=emeralds;toast('Smaragde gesetzt')};
    $('#ops',el).onclick=()=>{const b=B.find(b=>b.n===$('#os',el).value),p=parseInt($('#op',el).value);if(!b||!p||p<1)return;b.p=p;saveData();refresh();toast(`${b.n}: ${p} VB`)};
    $('#nb',el).onclick=()=>{const n=$('#nn',el).value.trim(),p=parseInt($('#np',el).value);
      if(!n||!p||p<1||B.some(b=>b.n===n))return toast('Name fehlt, Preis ungültig oder Name vergeben');
      B.push({n,col:$('#nc',el).value,c:$('#nk',el).value,p,s:+$('#ns',el).value,extra:1});saveData();refresh();$('#os',el).innerHTML=opts();toast(n+' hinzugefügt')};
  });
}

/* ---------- Winamp ---------- */
const SONGS=[{t:'Papaplatte - Bis zu ihr',src:'papaplatte-bis-zu-ihr.mp3'}];
const au=new Audio();au.volume=.8;let cur=0;
const fmt=s=>{s=Math.floor(s||0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function wl(){const l=document.querySelector('#wl');if(!l)return;l.innerHTML=SONGS.map((s,i)=>`<div class="${i==cur?'cur':''}" data-i="${i}">${i+1}. ${s.t} (${s.d?fmt(s.d):'?:??'})</div>`).join('');const m=document.querySelector('#wm');if(m)m.textContent=SONGS[cur].t+' *** '}
function loadSong(i,play){cur=i;au.src=SONGS[i].src;wl();if(play)au.play().catch(()=>toast('Wiedergabe blockiert – nochmal Play klicken'))}
au.onloadedmetadata=()=>{SONGS[cur].d=au.duration;wl()};
au.onended=()=>loadSong((cur+1)%SONGS.length,true);
setInterval(()=>{const t=document.querySelector('#wt');if(!t)return;t.textContent=fmt(au.currentTime);
  const sl=document.querySelector('#ws');if(au.duration&&document.activeElement!==sl)sl.value=au.currentTime/au.duration*1000;
  const c=document.querySelector('#wv');if(c){const x=c.getContext('2d');x.clearRect(0,0,76,16);const on=!au.paused;
    for(let i=0;i<19;i++){const h=on?2+Math.random()*13:1;x.fillStyle=h>10?'#e33':h>6?'#fc0':'#0c0';x.fillRect(i*4,16-h,3,h)}}},90);
function openWinamp(){
  openWin('wa','WINAMP',`<div class="wab">
   <div class="lcd"><div class="tm" id="wt">00:00</div><canvas id="wv" width="76" height="16"></canvas><div class="mq"><span id="wm"></span></div><div class="inf">128 kbps &nbsp; 44 kHz &nbsp; stereo</div></div>
   <input type="range" class="sl" id="ws" min="0" max="1000" value="0">
   <div class="ctl"><button id="wprev">⏮</button><button id="wplay">▶</button><button id="wpause">⏸</button><button id="wstop">⏹</button><button id="wnext">⏭</button><button id="wopen">⏏</button><input type="range" class="vol" id="wvol" min="0" max="100" value="${au.volume*100}"></div>
   <input type="file" id="wf" accept="audio/*" multiple hidden>
   <div class="pl" id="wl"></div></div>`,300,340,el=>{
    el.classList.add('wa');
    $('.x',el).addEventListener('click',()=>au.pause());
    const n=()=>SONGS.length;
    $('#wprev',el).onclick=()=>loadSong((cur-1+n())%n(),true);
    $('#wnext',el).onclick=()=>loadSong((cur+1)%n(),true);
    $('#wplay',el).onclick=()=>{if(!au.src)loadSong(cur,false);au.play().catch(()=>{})};
    $('#wpause',el).onclick=()=>au.pause();
    $('#wstop',el).onclick=()=>{au.pause();au.currentTime=0};
    $('#ws',el).oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
    $('#wvol',el).oninput=e=>au.volume=e.target.value/100;
    $('#wl',el).ondblclick=e=>{const i=e.target.dataset.i;if(i!=null)loadSong(+i,true)};
    $('#wopen',el).onclick=()=>$('#wf',el).click();
    $('#wf',el).onchange=e=>{[...e.target.files].forEach(f=>SONGS.push({t:f.name.replace(/\.[^.]+$/,''),src:URL.createObjectURL(f)}));wl()};
    if(!au.src)loadSong(cur,false);else wl();
  });
}
setTimeout(()=>apps.shop(),2400);
</script>
